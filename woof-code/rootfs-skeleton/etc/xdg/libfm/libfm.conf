[config]
single_click=1
use_trash=1
confirm_del=1
terminal=defaultterminal
thumbnail_local=1
thumbnail_max=2048
force_startup_notify=0
# Launch desktop icons and other executables without the
# "this file seems to be an executable script" dialog.
quick_exec=1

[ui]
big_icon_size=48
small_icon_size=24
thumbnail_size=128
pane_icon_size=24
show_thumbnail=0

[places]
places_desktop=0
places_applications=0
