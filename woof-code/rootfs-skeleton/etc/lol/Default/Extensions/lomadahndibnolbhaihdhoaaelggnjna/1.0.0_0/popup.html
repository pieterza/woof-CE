<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Proxy Auto Auth</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="panel">
      <header>
        <h1>Proxy Auto Auth</h1>
        <label class="switch">
          <input id="enabled" type="checkbox">
          <span>Enabled</span>
        </label>
      </header>

      <form id="settings-form">
        <label>
          Proxy host
          <input id="proxyHost" type="text" placeholder="proxy.example.com" autocomplete="off">
        </label>

        <label>
          Proxy port
          <input id="proxyPort" type="number" min="1" max="65535" placeholder="8080" inputmode="numeric">
        </label>

        <label>
          Username
          <input id="username" type="text" autocomplete="username">
        </label>

        <label>
          Password
          <input id="password" type="password" autocomplete="current-password">
        </label>

        <label>
          Max attempts per request
          <input id="maxAttemptsPerRequest" type="number" min="1" max="10" value="2" inputmode="numeric">
        </label>

        <div class="actions">
          <button type="submit">Save</button>
          <button id="clear" type="button" class="secondary">Clear</button>
        </div>
      </form>

      <p id="status" role="status" aria-live="polite"></p>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
